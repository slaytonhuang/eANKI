plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.eanki'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.eanki"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                // 讓 Room 把 schema JSON 輸出到版控裡，之後做 migration 才有依據
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // MigrationTestHelper 要從 assets 讀匯出的 schema 才建得出舊版資料庫
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Phase 0 踩過的坑：ML Kit / Room 會拉進 kotlin-stdlib-jdk7/jdk8:1.6.x，
    // 而 appcompat / material 會拉進 kotlin-stdlib:1.8.x。Kotlin 1.8 起
    // jdk7/jdk8 的內容已併回主 artifact，兩邊同時存在會在
    // checkDebugDuplicateClasses 炸掉。拉到同版本即可。
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.3'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    // Phase 3：ML Kit Text Recognition v2（bundled，模型打包進 APK，不需網路）
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Phase 3：CameraX 預覽 + 影像分析
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'
    // MlKitAnalyzer 會把辨識結果的座標直接換算到 PreviewView 的座標系，
    // 省掉自己處理旋轉、縮放與鏡像 —— SPEC 第 8 節點名這是整個專案 UI 最難的一塊
    implementation 'androidx.camera:camera-mlkit-vision:1.4.0'
    // 相簿照片常帶 EXIF 旋轉，不套用的話辨識到的是躺著的字
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // SPEC 第 2 節指定 WorkManager 做每日提醒
    implementation 'androidx.work:work-runtime:2.9.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // 排程邏輯是純 Java，用一般 JVM 測試跑，不需要模擬器
    testImplementation 'junit:junit:4.13.2'
    // android.jar 裡的 org.json 只是空殼，JVM 測試呼叫會丟 "not mocked"。
    // 換上真的實作，備份的 JSON 轉換才能用一般單元測試跑。
    testImplementation 'org.json:json:20240303'

    // DAO 的 SQL 要用真的 SQLite 才測得出來，所以跑 instrumented test
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
    androidTestImplementation 'androidx.work:work-testing:2.9.1'
}
